# Push CI on main — validate build scripts, release contract, feature config (no APK build).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build scripts executable + letterbox presets
        run: |
          set -euo pipefail
          for s in build_deepal.sh build_zeekr.sh build_zeekr_os7.sh build_zeekr_v30.sh build_apk.sh; do
            test -x "$s" || { echo "::error::$s missing or not executable"; exit 1; }
          done
          test -f NOTES-for-Maxim-0044.md
          test -f tools/apply_feature_config.py
          test -f tools/ynavi_release.py
          test -f tools/release_publish.py
          test -f releases/lines.json
          test -f releases/ynavi-release-manifest.schema.json
          test -f features/config.env.example
          test -f androiddebugkey.jks
          grep -q 'ZEEAPP_LETTERBOX_LEFT_DIP=0' build_zeekr_os7.sh
          grep -q 'ZEEAPP_LETTERBOX_LEFT_DIP=480' build_zeekr.sh
          grep -q 'ZEEAPP_LETTERBOX_TOP_DIP=91' build_deepal.sh
          grep -q 'ZEEAPP_LETTERBOX_BOTTOM_DIP=91' build_deepal.sh
          grep -q 'overwrite_files: false' .github/workflows/release.yml
          grep -q "tags:" .github/workflows/release.yml
          echo "Numbered releases: push tag ynavi-zeekr-v<upstream>+<modBuild> (see docs/0126-release-version-contract.md)."
      - name: Dry-run feature config (load + compile; no apktool)
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_feature_config.py
          python3 -m py_compile tools/ynavi_release.py tools/release_publish.py
          python3 - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          root = Path(".").resolve()
          spec = importlib.util.spec_from_file_location(
              "apply_feature_config", root / "tools" / "apply_feature_config.py"
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          cfg = mod.load_config(str(root / "features" / "config.env.example"))
          print("config ok:", cfg)
          PY
      - name: Release contract unit tests
        run: |
          set -euo pipefail
          python3 tests/test_ynavi_release.py
